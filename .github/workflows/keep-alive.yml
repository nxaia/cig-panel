name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 12 * * *'  # Todos los días a las 12:00 UTC (09:00 Argentina)
  workflow_dispatch:       # También se puede ejecutar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/expedientes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Supabase no respondió correctamente (status $STATUS)"
            exit 1
          fi
          echo "✅ Supabase activo"
